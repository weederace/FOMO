[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fomo-whale-intelligence"
version = "0.1.0"
description = "Public-data trader discovery, analytics, monitoring, and alerting."
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.4", "alembic>=1.13", "fastapi>=0.115", "httpx>=0.27",
  "playwright>=1.45", "pydantic>=2.8", "pydantic-settings>=2.4",
  "redis>=5.0", "sqlalchemy[asyncio]>=2.0", "asyncpg>=0.29", "uvicorn[standard]>=0.30"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6", "aiosqlite>=0.20"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100
# extend-exclude, not exclude: plain `exclude` would drop Ruff's own defaults and
# start linting .venv, __pycache__, and build output.
extend-exclude = ["alembic/versions", ".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E701", "B008", "B905"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
